dependencies:
  # Slang shader compiler (https://shader-slang.org/) - prebuilt Windows x86_64 package
  - download: https://github.com/shader-slang/slang/releases/download/v2026.22/slang-2026.22-windows-x86_64.zip
    folder: dependencies/slang
    all_x86_64:
      include_dirs:
        - include
      lib_dirs:
        - lib
      links:
        - slang
      copy_dll:
        - bin/slang.dll
        - bin/slang-compiler.dll

  # DirectX Shader Compiler - loaded by Slang as downstream compiler for DXIL output,
  # also usable directly via <dxcapi.h>
  - download: https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip
    folder: dependencies/dxc
    all_x86_64:
      include_dirs:
        - inc
      lib_dirs:
        - lib/x64
      links:
        - dxcompiler
      copy_dll:
        - bin/x64/dxcompiler.dll
        - bin/x64/dxil.dll

  # DirectX 12 Agility SDK (NuGet package Microsoft.Direct3D.D3D12, fetched as plain archive)
  # The runtime DLLs go into the D3D12/ subfolder next to the exe; that folder and the SDK
  # version are announced to the D3D12 loader in src/gfx/AgilitySDK.cpp - update both together.
  - download: https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.d3d12/1.620.2/microsoft.direct3d.d3d12.1.620.2.nupkg
    folder: dependencies/agility
    all_x86_64:
      include_dirs:
        - build/native/include
      copy_dll:
        - file: build/native/bin/x64/D3D12Core.dll
    # Debug layer, only needed (and only requested) in Debug builds
    debug_x86_64:
      copy_dll:
        - file: build/native/bin/x64/d3d12SDKLayers.dll
